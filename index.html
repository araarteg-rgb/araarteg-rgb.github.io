<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARA ART</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(180deg, #fffaf2 0%, #fddd95 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .profile {
    text-align: center;
    margin-bottom: 36px;
  }
  .avatar {
    width: 120px;
    height: 120px;
    margin: 0 auto 18px;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  h1 {
    font-size: 22px;
    color: #222;
    margin-bottom: 6px;
    font-weight: 700;
  }
  p.tag {
    color: #777;
    font-size: 14px;
    max-width: 280px;
    margin: 0 auto;
    line-height: 1.5;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 360px;
  }
  a.link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    padding: 16px 20px;
    border-radius: 14px;
    text-decoration: none;
    color: #222;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid #eee;
  }
  a.link-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.1);
  }
  .icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon svg {
    width: 40px;
    height: 40px;
  }
  .label {
    font-size: 16px;
    font-weight: 600;
  }
  .sub {
    font-size: 12px;
    color: #999;
    margin-top: 2px;
  }
  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #aaa;
  }
</style>
</head>
